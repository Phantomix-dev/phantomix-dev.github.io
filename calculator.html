<!DOCTYPE html>
<html lang="en">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-LX3YH0GSZG"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-LX3YH0GSZG');
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phantom-Calc | The Omni Calculator</title>
    
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/phantomix-dev/phantomix-dev.github.io/main/assets/favicon.png">
    <meta name="description" content="Phantom-Calc. An all-in-one offline calculator for Finance, Data Storage, Percentages, and everyday math.">
    
    <!-- Link to our global Design System -->
    <link rel="stylesheet" href="core.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Fira+Code:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        /* Modern App Shell Tweaks */
        .app-layout { padding-top: 20px; }
        .calc-wrapper {
            background: var(--surface-main); border: 1px solid var(--surface-border);
            border-radius: var(--radius-lg); overflow: hidden;
            box-shadow: var(--shadow-card);
        }

        /* 📱 Sleek Scrollable Tab Bar */
        .tab-bar {
            display: flex; overflow-x: auto; scrollbar-width: none;
            background: rgba(2, 6, 23, 0.8); border-bottom: 1px solid var(--surface-border);
            -webkit-overflow-scrolling: touch;
        }
        .tab-bar::-webkit-scrollbar { display: none; }
        
        .tab-item {
            padding: 15px 20px; white-space: nowrap; color: var(--text-secondary);
            font-weight: 600; font-size: 14px; cursor: pointer; transition: 0.3s;
            border-bottom: 3px solid transparent; display: flex; align-items: center; gap: 8px;
        }
        .tab-item:hover { color: var(--text-primary); background: rgba(255,255,255,0.02); }
        .tab-item.active {
            color: var(--brand-primary); border-bottom-color: var(--brand-primary);
            background: rgba(14, 165, 233, 0.05);
        }

        /* Tab Content Areas */
        .calc-section { display: none; padding: 25px; animation: fadeIn 0.4s; }
        .calc-section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Input Styling */
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
        .input-group input, .input-group select {
            width: 100%; padding: 15px; background: var(--bg-base); border: 1px solid var(--surface-border);
            color: var(--text-primary); border-radius: var(--radius-md); font-family: var(--font-sans);
            font-size: 16px; outline: none; box-sizing: border-box; transition: 0.3s;
        }
        .input-group input:focus, .input-group select:focus { border-color: var(--brand-primary); box-shadow: 0 0 15px rgba(14, 165, 233, 0.15); }

        /* Standard Calculator Grid */
        .std-display {
            width: 100%; background: var(--bg-base); padding: 20px; font-size: 32px;
            font-weight: 700; color: #fff; text-align: right; border: 1px solid var(--surface-border);
            border-radius: var(--radius-md); box-sizing: border-box; margin-bottom: 15px;
            font-family: 'Fira Code', monospace;
        }
        .std-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
        .calc-btn {
            background: var(--surface-elevated); color: var(--text-primary); border: 1px solid var(--surface-border);
            border-radius: var(--radius-md); padding: 18px; font-size: 20px; font-weight: 600;
            cursor: pointer; transition: 0.2s; font-family: 'Fira Code', monospace;
        }
        .calc-btn:hover { background: rgba(255,255,255,0.1); transform: translateY(-2px); }
        .calc-btn:active { transform: translateY(0); }
        .calc-btn.op { background: rgba(14, 165, 233, 0.1); color: var(--brand-primary); border-color: rgba(14, 165, 233, 0.3); }
        .calc-btn.eq { background: var(--brand-primary); color: white; grid-column: span 2; border-color: var(--brand-primary); }

        /* Premium Result Box */
        .result-box {
            background: var(--bg-base); border: 1px dashed var(--brand-primary);
            border-radius: var(--radius-md); padding: 25px; text-align: center; margin-top: 25px;
            position: relative; overflow: hidden;
        }
        .result-box::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 4px;
            background: linear-gradient(90deg, var(--brand-primary), var(--brand-secondary));
        }
        .result-label { font-size: 12px; color: var(--text-muted); text-transform: uppercase; font-weight: 700; letter-spacing: 1px; margin-bottom: 5px; }
        .result-value { font-size: 32px; font-weight: 700; color: #fff; margin-bottom: 5px; word-break: break-all; }
        .result-sub { font-size: 14px; font-weight: 600; }
    </style>
</head>
<body>

    <!-- GLOBAL NAVBAR -->
    <nav style="display: flex; justify-content: space-between; align-items: center; padding: 15px 5%; border-bottom: 1px solid var(--surface-border); background: var(--surface-main); backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 100;">
        <a href="index.html" style="font-weight: bold; font-size: 18px; color: var(--text-primary); text-decoration: none; display: flex; align-items: center; gap: 8px;">
            <i class="fa-solid fa-gem" style="color: var(--brand-primary);"></i> PHANTOMIX
        </a>
        <a href="apps.html" style="color: var(--text-secondary); text-decoration: none; font-size: 14px; font-weight: 600; padding: 8px 16px; background: rgba(14, 165, 233, 0.1); border: 1px solid var(--brand-primary); border-radius: var(--radius-sm); color: var(--brand-primary);"><i class="fas fa-arrow-left"></i> Hub</a>
    </nav>

    <div class="app-layout" style="max-width: 500px; grid-template-columns: 1fr; margin: 0 auto; padding-left: 15px; padding-right: 15px;">
        
        <div style="text-align: center; margin-bottom: 25px;">
            <h1 style="font-size: 28px; margin-bottom: 5px;">Phantom <span style="color: var(--brand-primary);">Calc</span></h1>
            <p style="color: var(--text-secondary); font-size: 14px; margin: 0;">The Omni Calculator Tool</p>
        </div>

        <div class="calc-wrapper">
            
            <!-- Sleek Tab Bar -->
            <div class="tab-bar">
                <div class="tab-item active" onclick="switchTab('standard', this)"><i class="fas fa-calculator"></i> Standard</div>
                <div class="tab-item" onclick="switchTab('discount', this)"><i class="fas fa-tag"></i> Discount</div>
                <div class="tab-item" onclick="switchTab('data', this)"><i class="fas fa-hdd"></i> Data Storage</div>
                <div class="tab-item" onclick="switchTab('fd', this)"><i class="fas fa-building-columns"></i> Finance (FD)</div>
            </div>

            <!-- 🔢 STANDARD CALCULATOR -->
            <div id="standard" class="calc-section active">
                <input type="text" class="std-display" id="stdDisplay" disabled value="0">
                <div class="std-grid">
                    <button class="calc-btn" style="color: var(--status-danger);" onclick="stdClear()">C</button>
                    <button class="calc-btn" onclick="stdAppend('(')">(</button>
                    <button class="calc-btn" onclick="stdAppend(')')">)</button>
                    <button class="calc-btn op" onclick="stdAppend('/')">÷</button>
                    
                    <button class="calc-btn" onclick="stdAppend('7')">7</button>
                    <button class="calc-btn" onclick="stdAppend('8')">8</button>
                    <button class="calc-btn" onclick="stdAppend('9')">9</button>
                    <button class="calc-btn op" onclick="stdAppend('*')">×</button>
                    
                    <button class="calc-btn" onclick="stdAppend('4')">4</button>
                    <button class="calc-btn" onclick="stdAppend('5')">5</button>
                    <button class="calc-btn" onclick="stdAppend('6')">6</button>
                    <button class="calc-btn op" onclick="stdAppend('-')">-</button>
                    
                    <button class="calc-btn" onclick="stdAppend('1')">1</button>
                    <button class="calc-btn" onclick="stdAppend('2')">2</button>
                    <button class="calc-btn" onclick="stdAppend('3')">3</button>
                    <button class="calc-btn op" onclick="stdAppend('+')">+</button>
                    
                    <button class="calc-btn" onclick="stdAppend('0')">0</button>
                    <button class="calc-btn" onclick="stdAppend('.')">.</button>
                    <button class="calc-btn eq" onclick="stdCalculate()">=</button>
                </div>
            </div>

            <!-- 🏷️ DISCOUNT CALCULATOR -->
            <div id="discount" class="calc-section">
                <div class="input-group">
                    <label>Original Price</label>
                    <input type="number" id="discPrice" placeholder="Enter amount" oninput="calcDiscount()">
                </div>
                <div class="input-group">
                    <label>Discount Percentage (%)</label>
                    <input type="number" id="discPercent" placeholder="e.g. 20" oninput="calcDiscount()">
                </div>
                
                <div class="result-box">
                    <div class="result-label">Final Price</div>
                    <div class="result-value" id="discResult">₹ 0.00</div>
                    <div class="result-sub" style="color: var(--status-success);" id="discSaved">Saved: ₹ 0.00</div>
                </div>
            </div>

            <!-- 💾 DATA STORAGE CALCULATOR -->
            <div id="data" class="calc-section">
                <div class="input-group">
                    <label>Data Value</label>
                    <input type="number" id="dataValue" placeholder="Enter value" oninput="calcData()">
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                    <div class="input-group">
                        <label>Convert From</label>
                        <select id="dataFrom" onchange="calcData()">
                            <option value="1">Bytes (B)</option>
                            <option value="1024">Kilobytes (KB)</option>
                            <option value="1048576">Megabytes (MB)</option>
                            <option value="1073741824" selected>Gigabytes (GB)</option>
                            <option value="1099511627776">Terabytes (TB)</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label>Convert To</label>
                        <select id="dataTo" onchange="calcData()">
                            <option value="1">Bytes (B)</option>
                            <option value="1024">Kilobytes (KB)</option>
                            <option value="1048576" selected>Megabytes (MB)</option>
                            <option value="1073741824">Gigabytes (GB)</option>
                            <option value="1099511627776">Terabytes (TB)</option>
                        </select>
                    </div>
                </div>
                
                <div class="result-box">
                    <div class="result-label">Converted Value</div>
                    <div class="result-value" id="dataResult" style="color: var(--brand-primary);">0</div>
                </div>
            </div>

            <!-- 🏦 FD CALCULATOR -->
            <div id="fd" class="calc-section">
                <div class="input-group">
                    <label>Principal Amount (₹)</label>
                    <input type="number" id="fdAmount" placeholder="e.g. 100000" oninput="calcFD()">
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                    <div class="input-group">
                        <label>Interest Rate (%)</label>
                        <input type="number" id="fdRate" placeholder="e.g. 7.5" oninput="calcFD()">
                    </div>
                    <div class="input-group">
                        <label>Time (Years)</label>
                        <input type="number" id="fdTime" placeholder="e.g. 5" oninput="calcFD()">
                    </div>
                </div>
                
                <div class="result-box">
                    <div class="result-label">Total Maturity Value</div>
                    <div class="result-value" id="fdResult">₹ 0.00</div>
                    <div class="result-sub" style="color: var(--status-success);" id="fdInterest">Wealth Gained: ₹ 0.00</div>
                </div>
            </div>

        </div>
    </div>

    <script>
        // 📱 Sleek Tab Switching Logic
        function switchTab(tabId, element) {
            // Remove active classes
            document.querySelectorAll('.tab-item').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.calc-section').forEach(sec => sec.classList.remove('active'));
            
            // Add active classes
            element.classList.add('active');
            document.getElementById(tabId).classList.add('active');

            // Scroll tab bar to center the clicked tab (for mobile)
            element.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
        }

        // 🔢 1. Standard Calculator Logic
        let stdExp = "";
        const stdDisplay = document.getElementById('stdDisplay');
        function stdAppend(val) {
            if(stdDisplay.value === "0" && val !== ".") stdExp = "";
            stdExp += val;
            stdDisplay.value = stdExp;
        }
        function stdClear() {
            stdExp = "";
            stdDisplay.value = "0";
        }
        function stdCalculate() {
            try {
                // Evaluation logic
                let result = eval(stdExp);
                stdDisplay.value = Number.isInteger(result) ? result : result.toFixed(4);
                stdExp = stdDisplay.value;
            } catch (e) {
                stdDisplay.value = "Error";
                stdExp = "";
            }
        }

        // 🏷️ 2. Discount Logic (Now updates in real-time)
        function calcDiscount() {
            let price = parseFloat(document.getElementById('discPrice').value);
            let percent = parseFloat(document.getElementById('discPercent').value);
            if(isNaN(price) || isNaN(percent)) return;
            
            let save = price * (percent / 100);
            let final = price - save;
            
            document.getElementById('discResult').innerText = `₹ ${final.toFixed(2)}`;
            document.getElementById('discSaved').innerText = `Saved: ₹ ${save.toFixed(2)}`;
        }

        // 💾 3. Data Storage Logic (Now updates in real-time)
        function calcData() {
            let val = parseFloat(document.getElementById('dataValue').value);
            let from = parseFloat(document.getElementById('dataFrom').value);
            let to = parseFloat(document.getElementById('dataTo').value);
            if(isNaN(val)) return;
            
            let bytes = val * from;
            let result = bytes / to;
            
            document.getElementById('dataResult').innerText = Number.isInteger(result) ? result : result.toFixed(4);
        }

        // 🏦 4. FD Calculator Logic (Now updates in real-time)
        function calcFD() {
            let p = parseFloat(document.getElementById('fdAmount').value);
            let r = parseFloat(document.getElementById('fdRate').value);
            let t = parseFloat(document.getElementById('fdTime').value);
            if(isNaN(p) || isNaN(r) || isNaN(t)) return;
            
            let amount = p * Math.pow((1 + (r / 100)), t);
            let interest = amount - p;
            
            document.getElementById('fdResult').innerText = `₹ ${amount.toFixed(2)}`;
            document.getElementById('fdInterest').innerText = `Wealth Gained: ₹ ${interest.toFixed(2)}`;
        }
    </script>
</body>
</html>
