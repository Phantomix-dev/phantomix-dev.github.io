<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Message Encoder | Phantomix</title>
    
    <!-- Link to our global Design System -->
    <link rel="stylesheet" href="core.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <!-- CryptoJS Library for Military-Grade AES Encryption -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>

    <style>
        .tabs { display: flex; background: var(--bg-base); border: 1px solid var(--surface-border); border-radius: var(--radius-md); overflow: hidden; margin-bottom: 25px; }
        .tab-btn { flex: 1; padding: 15px; text-align: center; cursor: pointer; font-weight: 600; color: var(--text-secondary); transition: 0.3s; }
        .tab-btn.active { background: rgba(14, 165, 233, 0.1); color: var(--brand-primary); border-bottom: 2px solid var(--brand-primary); }
        .tab-btn:hover:not(.active) { background: rgba(255, 255, 255, 0.05); }

        .input-box {
            width: 100%; background: var(--bg-base); border: 1px solid var(--surface-border);
            color: var(--text-primary); padding: 15px; border-radius: var(--radius-md);
            font-family: var(--font-sans); font-size: 15px; outline: none; transition: 0.3s;
            box-sizing: border-box; resize: vertical; min-height: 120px; margin-bottom: 15px;
        }
        .input-box:focus { border-color: var(--brand-primary); box-shadow: 0 0 15px rgba(14, 165, 233, 0.2); }

        .passcode-wrapper { position: relative; margin-bottom: 20px; }
        .passcode-wrapper i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--brand-secondary); }
        .passcode-input {
            width: 100%; background: rgba(139, 92, 246, 0.05); border: 1px dashed var(--brand-secondary);
            color: var(--brand-secondary); padding: 15px 15px 15px 45px; border-radius: var(--radius-md);
            font-weight: 600; outline: none; box-sizing: border-box; transition: 0.3s;
        }
        .passcode-input:focus { background: rgba(139, 92, 246, 0.1); box-shadow: 0 0 15px rgba(139, 92, 246, 0.3); }

        .result-container {
            margin-top: 30px; display: none; background: #020617;
            border: 1px solid var(--surface-border); border-radius: var(--radius-md);
            padding: 20px; position: relative;
        }
        .result-text {
            font-family: var(--font-mono); color: var(--status-success);
            font-size: 14px; word-break: break-all; margin: 0 0 20px 0;
            line-height: 1.6; max-height: 200px; overflow-y: auto;
        }
        .copy-btn {
            width: 100%; background: rgba(16, 185, 129, 0.1); color: var(--status-success);
            border: 1px solid var(--status-success); padding: 12px; border-radius: var(--radius-sm);
            font-weight: bold; cursor: pointer; transition: 0.3s; display: flex; justify-content: center; gap: 8px;
        }
        .copy-btn:hover { background: var(--status-success); color: #fff; }
    </style>
</head>
<body>

    <!-- GLOBAL NAVBAR -->
    <nav style="display: flex; justify-content: space-between; align-items: center; padding: 15px 5%; border-bottom: 1px solid var(--surface-border); background: var(--surface-main); backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 100;">
        <a href="index.html" style="font-weight: bold; font-size: 18px; color: var(--text-primary); text-decoration: none; display: flex; align-items: center; gap: 8px;">
            <i class="fa-solid fa-gem" style="color: var(--brand-primary);"></i> PHANTOMIX
        </a>
        <a href="apps.html" style="color: var(--text-secondary); text-decoration: none; font-size: 14px; font-weight: 600; padding: 8px 16px; background: rgba(14, 165, 233, 0.1); border: 1px solid var(--brand-primary); border-radius: var(--radius-sm); color: var(--brand-primary);"><i class="fas fa-arrow-left"></i> Hub</a>
    </nav>

    <div class="app-layout" style="max-width: 800px; grid-template-columns: 1fr;">
        
        <div style="text-align: center; margin-bottom: 10px;">
            <h1 style="font-size: 28px; margin-bottom: 10px;">Secure <span style="color: var(--brand-primary);">Message Encoder</span></h1>
            <p style="color: var(--text-secondary); font-size: 14px;">Lock your messages with military-grade AES encryption. Only those with the secret passcode can decode it.</p>
            <div style="display: flex; gap: 10px; justify-content: center; margin-top: 15px;">
                <span style="font-size: 10px; font-weight: bold; padding: 4px 10px; border-radius: 4px; background: rgba(139, 92, 246, 0.1); color: var(--brand-secondary); border: 1px solid rgba(139, 92, 246, 0.3);"><i class="fas fa-microchip"></i> AES-256 ENCRYPTION</span>
            </div>
        </div>

        <section style="background: var(--surface-main); border: 1px solid var(--surface-border); border-radius: var(--radius-lg); padding: var(--space-xl);">
            
            <!-- TABS -->
            <div class="tabs">
                <div class="tab-btn active" id="tab-encrypt" onclick="switchTab('encrypt')"><i class="fas fa-lock"></i> Encrypt</div>
                <div class="tab-btn" id="tab-decrypt" onclick="switchTab('decrypt')"><i class="fas fa-unlock-keyhole"></i> Decrypt</div>
            </div>

            <!-- INPUT AREA -->
            <textarea id="messageInput" class="input-box" placeholder="Type your secret message here..."></textarea>
            
            <div class="passcode-wrapper">
                <i class="fas fa-key"></i>
                <input type="text" id="passcodeInput" class="passcode-input" placeholder="Secret Passcode (e.g. phantom123)">
            </div>

            <!-- ACTION BUTTON -->
            <button class="btn-primary" id="actionBtn" style="width: 100%;" onclick="processMessage()">
                <i class="fas fa-lock"></i> Lock Message
            </button>

            <!-- RESULT AREA -->
            <div class="result-container" id="resultBox">
                <p style="margin: 0 0 10px 0; color: var(--text-muted); font-size: 12px; text-transform: uppercase;">Generated Output:</p>
                <p class="result-text" id="resultText"></p>
                <button class="copy-btn" id="copyBtn" onclick="copyResult()">
                    <i class="fas fa-copy"></i> Copy to Clipboard
                </button>
            </div>

        </section>
    </div>

    <!-- Encryption Logic -->
    <script>
        let currentMode = 'encrypt';

        function switchTab(mode) {
            currentMode = mode;
            const tabEncrypt = document.getElementById('tab-encrypt');
            const tabDecrypt = document.getElementById('tab-decrypt');
            const actionBtn = document.getElementById('actionBtn');
            const input = document.getElementById('messageInput');
            const resultBox = document.getElementById('resultBox');

            resultBox.style.display = 'none'; // Hide result on switch

            if (mode === 'encrypt') {
                tabEncrypt.classList.add('active');
                tabDecrypt.classList.remove('active');
                actionBtn.innerHTML = '<i class="fas fa-lock"></i> Lock Message';
                actionBtn.style.background = 'var(--brand-primary)';
                input.placeholder = "Type your secret message here...";
                input.value = "";
            } else {
                tabDecrypt.classList.add('active');
                tabEncrypt.classList.remove('active');
                actionBtn.innerHTML = '<i class="fas fa-unlock-keyhole"></i> Decode Message';
                actionBtn.style.background = 'var(--brand-secondary)';
                input.placeholder = "Paste the scrambled alien code here...";
                input.value = "";
            }
        }

        function processMessage() {
            const text = document.getElementById('messageInput').value.trim();
            const pass = document.getElementById('passcodeInput').value.trim();
            const resultBox = document.getElementById('resultBox');
            const resultText = document.getElementById('resultText');

            if (!text) {
                alert("Please enter a message!");
                return;
            }

            // Fallback key if user doesn't enter a passcode
            const secretKey = pass ? pass : "phantomix-default-key";

            try {
                if (currentMode === 'encrypt') {
                    // Encrypt using AES
                    const cipherText = CryptoJS.AES.encrypt(text, secretKey).toString();
                    resultText.innerText = cipherText;
                    resultText.style.color = "var(--brand-primary)";
                } else {
                    // Decrypt using AES
                    const bytes = CryptoJS.AES.decrypt(text, secretKey);
                    const originalText = bytes.toString(CryptoJS.enc.Utf8);
                    
                    if (!originalText) throw new Error("Invalid passcode or corrupted code.");
                    
                    resultText.innerText = originalText;
                    resultText.style.color = "var(--status-success)";
                }
                resultBox.style.display = 'block';
            } catch (error) {
                resultText.innerText = "❌ Decryption Failed! Either the text is broken or your passcode is wrong.";
                resultText.style.color = "var(--status-danger)";
                resultBox.style.display = 'block';
            }
            
            // Reset Copy Button
            const copyBtn = document.getElementById('copyBtn');
            copyBtn.innerHTML = '<i class="fas fa-copy"></i> Copy to Clipboard';
            copyBtn.style.background = 'rgba(16, 185, 129, 0.1)';
            copyBtn.style.color = 'var(--status-success)';
        }

        function copyResult() {
            const text = document.getElementById('resultText').innerText;
            if(text.includes("❌")) return; // Don't copy errors

            navigator.clipboard.writeText(text).then(() => {
                const copyBtn = document.getElementById('copyBtn');
                copyBtn.innerHTML = '<i class="fas fa-check"></i> Copied!';
                copyBtn.style.background = 'var(--status-success)';
                copyBtn.style.color = '#fff';
            });
        }
    </script>
</body>
</html>
