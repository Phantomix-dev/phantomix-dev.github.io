<!DOCTYPE html>
<html lang="en">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-LX3YH0GSZG"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-LX3YH0GSZG');
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phantom-Morph | Offline Image Converter</title>

    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/phantomix-dev/phantomix-dev.github.io/main/assets/favicon.png">
    <meta name="description" content="Phantom Morph. 100% offline image converter. Convert JPG, PNG, and WEBP instantly without servers.">

    <!-- Link to our global Design System -->
    <link rel="stylesheet" href="core.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Fira+Code:wght@500;700&display=swap" rel="stylesheet">

    <style>
        .upload-zone {
            background: var(--bg-base); border: 2px dashed var(--surface-border);
            border-radius: var(--radius-lg); padding: 50px 20px; text-align: center;
            cursor: pointer; transition: all 0.3s ease; position: relative;
        }
        .upload-zone:hover { border-color: var(--brand-secondary); background: rgba(139, 92, 246, 0.05); }
        .upload-zone i { font-size: 48px; color: var(--brand-secondary); margin-bottom: 15px; }
        .upload-zone h4 { color: var(--text-primary); margin: 0 0 5px 0; font-size: 18px; }
        .upload-zone p { color: var(--text-muted); font-size: 13px; margin: 0; }
        
        #fileInput { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }

        .workspace { display: none; margin-top: 25px; animation: fadeIn 0.4s; }
        
        .file-info-card {
            background: var(--bg-base); border: 1px solid var(--surface-border);
            border-radius: var(--radius-md); padding: 20px; margin-bottom: 25px;
            display: flex; align-items: center; justify-content: space-between;
        }
        .file-name { font-weight: 600; color: var(--text-primary); font-size: 15px; margin: 0 0 5px 0; word-break: break-all; }
        .file-meta { font-size: 12px; color: var(--text-muted); font-family: 'Fira Code', monospace; }
        
        .format-badge {
            background: rgba(139, 92, 246, 0.1); color: var(--brand-secondary);
            padding: 8px 15px; border-radius: var(--radius-sm); font-weight: bold;
            border: 1px solid rgba(139, 92, 246, 0.3); font-size: 14px;
        }

        .settings-panel {
            background: var(--surface-elevated); padding: 25px; border-radius: var(--radius-md);
            border: 1px solid var(--surface-border); margin-bottom: 25px;
        }
        .settings-panel label { display: block; font-size: 13px; font-weight: 600; color: var(--text-secondary); margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; }
        
        select {
            width: 100%; padding: 15px; background: var(--bg-base); border: 1px solid var(--surface-border);
            color: var(--text-primary); border-radius: var(--radius-sm); font-family: var(--font-sans);
            font-size: 15px; outline: none; cursor: pointer; transition: 0.3s;
        }
        select:focus { border-color: var(--brand-secondary); box-shadow: 0 0 15px rgba(139, 92, 246, 0.2); }

        .btn-morph {
            width: 100%; padding: 16px; background: linear-gradient(135deg, var(--brand-secondary), #c084fc);
            color: #fff; border: none; border-radius: var(--radius-sm); font-size: 16px; font-weight: 700;
            cursor: pointer; transition: 0.3s; display: flex; justify-content: center; align-items: center; gap: 10px;
        }
        .btn-morph:hover { box-shadow: 0 0 25px rgba(139, 92, 246, 0.4); transform: translateY(-2px); }

        @media (max-width: 600px) {
            .file-info-card { flex-direction: column; text-align: center; gap: 15px; }
        }
    </style>
</head>
<body>

    <!-- GLOBAL NAVBAR -->
    <nav style="display: flex; justify-content: space-between; align-items: center; padding: 15px 5%; border-bottom: 1px solid var(--surface-border); background: var(--surface-main); backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 100;">
        <a href="index.html" style="font-weight: bold; font-size: 18px; color: var(--text-primary); text-decoration: none; display: flex; align-items: center; gap: 8px;">
            <i class="fa-solid fa-gem" style="color: var(--brand-primary);"></i> PHANTOMIX
        </a>
        <a href="apps.html" style="color: var(--text-secondary); text-decoration: none; font-size: 14px; font-weight: 600; padding: 8px 16px; background: rgba(14, 165, 233, 0.1); border: 1px solid var(--brand-primary); border-radius: var(--radius-sm); color: var(--brand-primary);"><i class="fas fa-arrow-left"></i> Hub</a>
    </nav>

    <div class="app-layout" style="max-width: 700px; grid-template-columns: 1fr;">
        
        <div style="text-align: center; margin-bottom: 10px;">
            <h1 style="font-size: 28px; margin-bottom: 10px;">Phantom <span style="color: var(--brand-secondary);">Morph</span></h1>
            <p style="color: var(--text-secondary); font-size: 14px;">100% offline image format converter. Your files never touch a server.</p>
            <div style="display: flex; gap: 10px; justify-content: center; margin-top: 15px;">
                <span style="font-size: 10px; font-weight: bold; padding: 4px 10px; border-radius: 4px; background: rgba(139, 92, 246, 0.1); color: var(--brand-secondary); border: 1px solid rgba(139, 92, 246, 0.3);"><i class="fas fa-microchip"></i> 100% LOCAL</span>
            </div>
        </div>

        <section style="background: var(--surface-main); border: 1px solid var(--surface-border); border-radius: var(--radius-lg); padding: var(--space-xl);">
            
            <div class="upload-zone" id="dropZone">
                <i class="fas fa-exchange-alt"></i>
                <h4>Select an Image</h4>
                <p>Drop your JPG, PNG, or WEBP file here.</p>
                <input type="file" id="fileInput" accept="image/jpeg, image/png, image/webp">
            </div>

            <!-- Workspace: Appears after file is selected -->
            <div class="workspace" id="convertSection">
                
                <div class="file-info-card">
                    <div>
                        <p class="file-name" id="fileName">image.jpg</p>
                        <p class="file-meta" id="fileMeta">Size: 0 MB</p>
                    </div>
                    <div class="format-badge" id="originalFormat">JPG</div>
                </div>

                <div class="settings-panel">
                    <label>Target Format</label>
                    <select id="outputFormat">
                        <option value="image/png">PNG (Lossless / Transparent)</option>
                        <option value="image/jpeg">JPG (Standard / Smaller Size)</option>
                        <option value="image/webp">WEBP (Next-Gen Web Format)</option>
                    </select>
                </div>

                <div style="display: flex; gap: 15px;">
                    <button class="btn-morph" id="convertBtn" style="flex: 2;">
                        <i class="fas fa-bolt"></i> Morph & Download
                    </button>
                    <button onclick="resetTool()" style="flex: 1; background: var(--bg-base); color: var(--text-primary); border: 1px solid var(--surface-border); border-radius: var(--radius-sm); font-weight: 600; cursor: pointer; transition: 0.3s;">
                        <i class="fas fa-redo"></i> New
                    </button>
                </div>

            </div>

        </section>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const dropZone = document.getElementById('dropZone');
        const convertSection = document.getElementById('convertSection');
        
        const fileNameDisplay = document.getElementById('fileName');
        const fileMetaDisplay = document.getElementById('fileMeta');
        const originalFormatBadge = document.getElementById('originalFormat');
        
        const outputFormat = document.getElementById('outputFormat');
        const convertBtn = document.getElementById('convertBtn');

        let originalFile = null;

        function formatBytes(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            originalFile = file;
            
            // Switch UI State
            dropZone.style.display = 'none';
            convertSection.style.display = 'block';

            // Populate File Data
            fileNameDisplay.innerText = file.name;
            fileMetaDisplay.innerText = `Size: ${formatBytes(file.size)}`;

            // Extract & Display Original Extension
            let ext = file.type.split('/')[1].toUpperCase();
            if (ext === 'JPEG') ext = 'JPG';
            originalFormatBadge.innerText = ext;
            
            // Reset Button State
            convertBtn.innerHTML = '<i class="fas fa-bolt"></i> Morph & Download';
            convertBtn.style.background = 'linear-gradient(135deg, var(--brand-secondary), #c084fc)';
        });

        convertBtn.addEventListener('click', () => {
            if (!originalFile) return;

            // Loading State
            convertBtn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Processing...';
            convertBtn.style.background = 'var(--surface-border)';

            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.src = event.target.result;
                
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = img.width;
                    canvas.height = img.height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0);

                    const targetType = outputFormat.value;
                    let newExt = targetType.split('/')[1];
                    if (newExt === 'jpeg') newExt = 'jpg';

                    // Prepare new filename
                    const baseName = originalFile.name.substring(0, originalFile.name.lastIndexOf('.')) || originalFile.name;
                    const newFileName = `Phantom_${baseName}.${newExt}`;

                    // Native Canvas Conversion
                    canvas.toBlob((blob) => {
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = newFileName;
                        document.body.appendChild(a);
                        a.click();
                        document.body.removeChild(a);

                        // Success State
                        convertBtn.innerHTML = '<i class="fas fa-check"></i> Downloaded Successfully';
                        convertBtn.style.background = 'var(--status-success)';
                        
                        setTimeout(() => {
                            convertBtn.innerHTML = '<i class="fas fa-bolt"></i> Morph Again';
                            convertBtn.style.background = 'linear-gradient(135deg, var(--brand-secondary), #c084fc)';
                        }, 3000);

                    }, targetType, 1.0); // 1.0 max quality
                };
            };
            reader.readAsDataURL(originalFile);
        });

        function resetTool() {
            fileInput.value = '';
            originalFile = null;
            convertSection.style.display = 'none';
            dropZone.style.display = 'block';
        }
    </script>
</body>
</html>
