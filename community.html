<!DOCTYPE html>
<html lang="en">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-LX3YH0GSZG"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-LX3YH0GSZG');

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Community | Phantomix</title>
    <link rel="icon" type="image/png" href="logo.png">
    
    <link rel="stylesheet" href="core.css">
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        /* 🎨 CUSTOM PHANTOMIX TEXT SELECTION */
        ::selection { background-color: var(--brand-primary, #0ea5e9); color: #ffffff; }

        /* ✨ PREMIUM FADE-IN ANIMATION */
        body {
            animation: appLoad 0.5s ease-out forwards;
            margin: 0; padding: 0; padding-top: 80px;
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-base, #020617); 
            color: var(--text-primary, #f8fafc);
            text-align: center; overflow-x: hidden;
            background-image: radial-gradient(circle at 50% 50%, rgba(14, 165, 233, 0.05) 0%, transparent 60%);
        }

        @keyframes appLoad {
            0% { opacity: 0; transform: translateY(15px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* 🎚️ CUSTOM CYBER SCROLLBAR */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-base, #0f172a); }
        ::-webkit-scrollbar-thumb { background: rgba(14, 165, 233, 0.5); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--brand-primary, #0ea5e9); }

        /* NAVBAR - CLEAR LOGOUT BUTTON */
        .phantomix-navbar {
            position: fixed; top: 0; left: 0; width: 100%; height: 70px;
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 5%; box-sizing: border-box;
            background: rgba(2, 6, 23, 0.9); backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--surface-border, rgba(14, 165, 233, 0.3)); z-index: 1000;
        }
        .nav-logo { font-size: 20px; font-weight: 700; color: white; display: flex; align-items: center; text-decoration: none; gap: 8px;}
        
        .nav-actions { display: flex; gap: 15px; align-items: center; }
        
        .back-btn {
            background: rgba(14, 165, 233, 0.1); color: var(--brand-primary, #0ea5e9);
            padding: 8px 18px; border: 1px solid var(--brand-primary, #0ea5e9); border-radius: 6px;
            text-decoration: none; font-size: 14px; font-weight: 600; transition: all 0.3s ease;
        }
        .back-btn:hover { background: var(--brand-primary, #0ea5e9); color: white; box-shadow: 0 0 15px rgba(14, 165, 233, 0.4); }
        
        .logout-btn {
            background: rgba(239, 68, 68, 0.1); color: var(--status-danger, #ef4444);
            padding: 8px 18px; border: 1px solid var(--status-danger, #ef4444); border-radius: 6px;
            cursor: pointer; font-size: 14px; font-weight: 600; transition: all 0.3s; font-family: 'Poppins', sans-serif;
        }
        .logout-btn:hover { background: var(--status-danger, #ef4444); color: white; box-shadow: 0 0 15px rgba(239, 68, 68, 0.4); }

        /* MAIN CHAT WRAPPER */
        .chat-wrapper { max-width: 900px; margin: 20px auto 40px; padding: 0 20px; display: flex; flex-direction: column; height: calc(100vh - 140px); }
        
        .chat-header { margin-bottom: 20px; }
        .chat-header h1 { color: var(--text-primary, #fff); font-size: 32px; margin: 0 0 5px 0; }
        .chat-header p { color: var(--text-secondary, #94a3b8); font-size: 15px; margin: 0; }

        /* CHAT BOX (CENTERED & CLEAN) */
        .chat-box {
            background: var(--surface-main, rgba(15, 23, 42, 0.8)); 
            border: 1px solid var(--surface-border, rgba(14, 165, 233, 0.3));
            border-radius: 16px; padding: 25px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            display: flex; flex-direction: column; flex: 1; overflow: hidden;
            backdrop-filter: blur(10px);
        }

        #chat-messages {
            flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 15px;
            padding-right: 15px; margin-bottom: 25px; text-align: left;
        }

        /* Message Bubbles */
        .msg-bubble {
            background: rgba(30, 41, 59, 0.6); padding: 15px 20px; 
            border-radius: 12px; border-left: 3px solid var(--brand-primary, #0ea5e9); 
            font-size: 15px; line-height: 1.6; animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .msg-sender { color: var(--brand-primary, #0ea5e9); font-weight: 700; font-family: 'Courier Prime', monospace; margin-right: 10px; font-size: 16px; }
        .msg-time { color: var(--text-muted, #64748b); font-size: 12px; font-family: 'Courier Prime', monospace; }
        .msg-text { color: var(--text-primary, #e2e8f0); display: block; margin-top: 8px; word-wrap: break-word; }

        /* INPUT AREA (LARGE & CLEAR) */
        .input-group { display: flex; gap: 15px; background: transparent; }
        
        /* Who is sending */
        .sender-input {
            width: 160px; padding: 15px; border-radius: 8px;
            border: 1px solid var(--surface-border, #334155); background: var(--bg-base, #020617); 
            color: var(--status-success, #10b981); font-size: 16px; font-family: 'Courier Prime', monospace; 
            font-weight: bold; outline: none; text-align: center;
        }
        
        /* Message Field */
        .msg-input {
            flex: 1; padding: 15px 20px; border-radius: 8px;
            border: 1px solid var(--surface-border, #334155); background: var(--bg-base, #020617); 
            color: white; font-size: 16px; font-family: 'Poppins', sans-serif; outline: none; 
            transition: all 0.3s;
        }
        .msg-input:focus { border-color: var(--brand-primary, #0ea5e9); box-shadow: 0 0 15px rgba(14, 165, 233, 0.2); }
        .msg-input::placeholder { color: var(--text-muted, #64748b); }
        
        /* Send Button */
        .send-btn {
            background: linear-gradient(135deg, var(--brand-primary, #0ea5e9), #3b82f6); color: white;
            border: none; padding: 0 25px; border-radius: 8px;
            font-weight: 700; cursor: pointer; transition: all 0.3s; font-size: 18px;
            display: flex; align-items: center; justify-content: center;
        }
        .send-btn:hover { box-shadow: 0 0 20px rgba(14, 165, 233, 0.5); transform: translateY(-2px); }

        /* Mobile adjustments for inputs */
        @media (max-width: 600px) {
            .phantomix-navbar { padding: 0 15px; height: 65px; }
            .nav-logo { font-size: 16px; }
            .nav-actions { gap: 10px; }
            .back-btn, .logout-btn { padding: 6px 12px; font-size: 12px; }
            
            .input-group { flex-direction: column; gap: 10px; }
            .sender-input { width: 100%; padding: 12px; font-size: 14px; }
            .msg-input { padding: 14px; font-size: 15px; }
            .send-btn { padding: 14px; width: 100%; justify-content: center; }
            
            .chat-wrapper { height: calc(100vh - 100px); }
        }
    </style>
</head>
<body>

    <!-- NAVBAR -->
    <nav class="phantomix-navbar">
        <a href="index.html" class="nav-logo">
            <i class="fa-solid fa-users" style="color: var(--brand-primary, #0ea5e9);"></i> COMMUNITY
        </a>
        <div class="nav-actions">
            <a href="index.html" class="back-btn"><i class="fas fa-home"></i> <span style="display:none; @media(min-width:600px){display:inline;}">Home</span></a>
            <!-- CLEAR LOGOUT BUTTON -->
            <button class="logout-btn" onclick="logoutNode()"><i class="fas fa-power-off"></i> Logout</button>
        </div>
    </nav>

    <!-- CHAT WORKSPACE -->
    <div class="chat-wrapper">
        
        <div class="chat-header">
            <h1>Global Node <span style="color: var(--brand-primary, #0ea5e9);">Chat</span></h1>
            <p>Connect with other verified founders and early adopters.</p>
        </div>

        <div class="chat-box">
            
            <!-- MESSAGES AREA -->
            <div id="chat-messages">
                <div style="text-align: center; color: var(--text-muted, #64748b); font-size: 14px; margin: auto; font-family: 'Courier Prime', monospace;">
                    <i class="fas fa-satellite-dish fa-spin"></i> Authenticating and Connecting to Mainframe...
                </div>
            </div>

            <!-- INPUT AREA -->
            <div class="input-group">
                <input type="text" id="chat-sender" class="sender-input" readonly title="Your Alias (Locked)">
                <input type="text" id="chat-text" class="msg-input" placeholder="Type your secure message here..." autocomplete="off" onkeypress="if(event.key === 'Enter') sendChatMessage()">
                <button class="send-btn" onclick="sendChatMessage()" title="Send Message">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
            
        </div>
    </div>

    <!-- ORIGINAL BACKEND LOGIC (Unchanged) -->
    <script>
        // 🔒 DIGITAL BOUNCER
        const userToken = localStorage.getItem("phantomix_token");
        const userId = localStorage.getItem("phantomix_user_id");
        const savedAlias = localStorage.getItem("phantomix_alias");

        if (!userToken || !userId || !savedAlias) {
            window.location.href = "login.html";
        }

        // ⚠️ SUPABASE CREDENTIALS
        const SUPABASE_URL = "https://pekmsttmosuzcvielala.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBla21zdHRtb3N1emN2aWVsYWxhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM0MjY4NDUsImV4cCI6MjA5OTAwMjg0NX0.D0akjMO2d5sYhgbSy8IIFJT4sPHGO_Lm9r1YMWM_uUc";

        // Set Alias
        window.addEventListener('DOMContentLoaded', () => {
            if(savedAlias) {
                document.getElementById("chat-sender").value = `[ ${savedAlias} ]`;
            }
        });

        // 🚪 Logout Function
        function logoutNode() {
            localStorage.removeItem("phantomix_token");
            localStorage.removeItem("phantomix_user_id");
            localStorage.removeItem("phantomix_alias");
            window.location.href = "login.html";
        }

        // Fetch Messages
        async function fetchChatMessages() {
            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/global_chat?select=*&order=created_at.desc&limit=50`, {
                    headers: { 
                        "apikey": SUPABASE_KEY, 
                        "Authorization": `Bearer ${userToken}` 
                    }
                });
                
                if (response.status === 401) { logoutNode(); return; }

                const messages = await response.json();
                const chatBox = document.getElementById("chat-messages");
                messages.reverse(); 
                
                const isScrolledToBottom = chatBox.scrollHeight - chatBox.clientHeight <= chatBox.scrollTop + 50;

                chatBox.innerHTML = "";
                messages.forEach(msg => {
                    const time = new Date(msg.created_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                    
                    let safeMsg = msg.message.replace(/</g, "&lt;").replace(/>/g, "&gt;"); 
                    let safeAlias = msg.alias.replace(/</g, "&lt;").replace(/>/g, "&gt;");

                    chatBox.innerHTML += `
                        <div class="msg-bubble">
                            <span class="msg-sender">${safeAlias}</span> 
                            <span class="msg-time">${time}</span>
                            <span class="msg-text">${safeMsg}</span>
                        </div>
                    `;
                });

                if (isScrolledToBottom) chatBox.scrollTop = chatBox.scrollHeight;

            } catch(e) { console.error("Chat sync failed", e); }
        }

        // Send Message
        async function sendChatMessage() {
            const messageInput = document.getElementById("chat-text");
            const message = messageInput.value.trim();

            if(!message) return;
            messageInput.value = ""; 
            
            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/global_chat`, {
                    method: "POST",
                    headers: {
                        "apikey": SUPABASE_KEY,
                        "Authorization": `Bearer ${userToken}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ 
                        user_id: userId,   
                        alias: savedAlias, 
                        message: message 
                    })
                });

                if (!response.ok) throw new Error("Unauthorized Transmission");
                
                fetchChatMessages(); 
                
                setTimeout(() => {
                    const chatBox = document.getElementById("chat-messages");
                    chatBox.scrollTop = chatBox.scrollHeight;
                }, 100);

            } catch(e) { 
                alert("Transmission Failed! Please login again.");
            }
        }

        setInterval(fetchChatMessages, 3000);
        window.addEventListener('load', fetchChatMessages);
    </script>
</body>
</html>
