<!DOCTYPE html>
<html lang="en">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-LX3YH0GSZG"></script>
    <script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Glitch Generator | Phantomix</title>

    <!-- Link to our global Design System -->
    <link rel="stylesheet" href="core.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Fira+Code:wght@500;700&display=swap" rel="stylesheet">

    <style>
        /* Matrix Terminal Container */
        .terminal-box {
            background: #020617; border: 1px solid var(--status-success);
            border-radius: var(--radius-lg); padding: 30px;
            box-shadow: 0 0 40px rgba(16, 185, 129, 0.15);
            position: relative; overflow: hidden; text-align: left;
        }

        /* Top Glowing Scanline Effect */
        .terminal-box::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 2px;
            background: var(--status-success);
            box-shadow: 0 0 15px var(--status-success);
            animation: scanline 4s linear infinite;
        }
        @keyframes scanline {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(400px); opacity: 0; }
        }

        .terminal-header {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px dashed rgba(16, 185, 129, 0.4); padding-bottom: 15px; margin-bottom: 25px;
        }
        .terminal-title { color: var(--status-success); font-family: 'Fira Code', monospace; font-size: 14px; margin: 0; font-weight: bold; }
        .blinking-cursor { display: inline-block; width: 8px; height: 15px; background: var(--status-success); animation: blink 1s step-end infinite; margin-left: 5px; vertical-align: middle; }
        @keyframes blink { 50% { opacity: 0; } }

        /* Input Area */
        .input-group { position: relative; margin-bottom: 25px; }
        .input-group i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 14px; }
        .cyber-input {
            width: 100%; padding: 15px 15px 15px 40px; background: rgba(16, 185, 129, 0.05);
            border: 1px solid rgba(16, 185, 129, 0.3); color: var(--text-primary);
            border-radius: var(--radius-sm); font-family: 'Fira Code', monospace;
            font-size: 15px; outline: none; transition: 0.3s; box-sizing: border-box;
        }
        .cyber-input:focus { border-color: var(--status-success); box-shadow: 0 0 15px rgba(16, 185, 129, 0.2); }
        .cyber-input::placeholder { color: rgba(16, 185, 129, 0.4); }

        /* Output Area */
        .output-container {
            background: rgba(2, 6, 23, 0.8); border: 1px dashed var(--status-danger);
            border-radius: var(--radius-sm); padding: 25px; min-height: 120px;
            display: flex; align-items: center; justify-content: center;
            margin-bottom: 25px; word-break: break-all;
        }
        #output-box {
            color: var(--text-muted); font-size: 20px; font-family: 'Fira Code', monospace;
            letter-spacing: 1px; text-align: center; line-height: 1.5;
        }

        /* Action Buttons */
        .action-row { display: flex; gap: 15px; }
        .btn-cyber {
            flex: 1; padding: 14px; background: rgba(16, 185, 129, 0.1); color: var(--status-success);
            border: 1px solid var(--status-success); border-radius: var(--radius-sm); font-family: 'Fira Code', monospace;
            font-weight: 700; cursor: pointer; transition: 0.3s; display: flex; justify-content: center; align-items: center; gap: 8px;
        }
        .btn-cyber:hover { background: var(--status-success); color: #020617; box-shadow: 0 0 20px rgba(16, 185, 129, 0.4); }

        .btn-share {
            flex: 1; padding: 14px; background: transparent; color: var(--text-primary);
            border: 1px solid var(--surface-border); border-radius: var(--radius-sm); font-family: var(--font-sans);
            font-weight: 600; cursor: pointer; transition: 0.3s; display: flex; justify-content: center; align-items: center; gap: 8px;
        }
        .btn-share:hover { background: rgba(255, 255, 255, 0.1); border-color: var(--text-secondary); }

        @media (max-width: 600px) {
            .action-row { flex-direction: column; }
        }
    </style>
</head>
<body>

    <!-- GLOBAL NAVBAR -->
    <nav style="display: flex; justify-content: space-between; align-items: center; padding: 15px 5%; border-bottom: 1px solid var(--surface-border); background: var(--surface-main); backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 100;">
        <a href="index.html" style="font-weight: bold; font-size: 18px; color: var(--text-primary); text-decoration: none; display: flex; align-items: center; gap: 8px;">
            <i class="fa-solid fa-gem" style="color: var(--brand-primary);"></i> PHANTOMIX
        </a>
        <a href="apps.html" style="color: var(--text-secondary); text-decoration: none; font-size: 14px; font-weight: 600; padding: 8px 16px; background: rgba(14, 165, 233, 0.1); border: 1px solid var(--brand-primary); border-radius: var(--radius-sm); color: var(--brand-primary);"><i class="fas fa-arrow-left"></i> Hub</a>
    </nav>

    <div class="app-layout" style="max-width: 700px; grid-template-columns: 1fr;">
        
        <div style="text-align: center; margin-bottom: 20px;">
            <h1 style="font-size: 32px; margin-bottom: 10px;">Cyber <span style="color: var(--status-success);">Glitch</span> Generator</h1>
            <p style="color: var(--text-secondary); font-size: 14px;">Corrupt your text stream for secure data masking. Untraceable visual noise.</p>
        </div>

        <section class="terminal-box">
            
            <div class="terminal-header">
                <p class="terminal-title">root@phantomix:~/glitch_engine<span class="blinking-cursor"></span></p>
                <span style="font-size: 10px; font-weight: bold; padding: 4px 10px; border-radius: 4px; background: rgba(239, 68, 68, 0.1); color: var(--status-danger); border: 1px solid rgba(239, 68, 68, 0.3);"><i class="fas fa-biohazard"></i> CORRUPT</span>
            </div>

            <!-- Input Area -->
            <div class="input-group">
                <i class="fas fa-terminal"></i>
                <input type="text" id="normal-text" class="cyber-input" placeholder="Enter clean data string..." oninput="corruptText()">
            </div>

            <!-- Output Display -->
            <div class="output-container">
                <div id="output-box">Awaiting data injection...</div>
            </div>

            <!-- Actions -->
            <div class="action-row">
                <button class="btn-cyber" id="copyBtn" onclick="copyToClipboard()">
                    <i class="fas fa-copy"></i> Extract Code
                </button>
                <button class="btn-share" onclick="shareText()">
                    <i class="fas fa-share-nodes"></i> Broadcast
                </button>
            </div>

        </section>

    </div>

    <!-- ORIGINAL ZALGO GLITCH ALGORITHM -->
    <script>
        const zalgoUp = ['\u030d', '\u030e', '\u0304', '\u0305', '\u033f', '\u0311', '\u0306', '\u0310', '\u0352', '\u0357', '\u0351', '\u0307', '\u0308', '\u030a', '\u0342', '\u0343', '\u0344', '\u034a', '\u034b', '\u034c', '\u0303', '\u0302', '\u030c', '\u0350', '\u0300', '\u0301', '\u030b', '\u030f', '\u0312', '\u0313', '\u0314', '\u033d', '\u0309', '\u035b', '\u0346', '\u031a'];
        const zalgoDown = ['\u0316', '\u0317', '\u0318', '\u0319', '\u031c', '\u031d', '\u031e', '\u031f', '\u0320', '\u0324', '\u0325', '\u0326', '\u0329', '\u032a', '\u032b', '\u032c', '\u032d', '\u032e', '\u032f', '\u0330', '\u0331', '\u0332', '\u0333', '\u0339', '\u033a', '\u033b', '\u033c', '\u0345', '\u0347', '\u0348', '\u0349', '\u034d', '\u034e', '\u0353', '\u0354', '\u0355', '\u0356', '\u0359', '\u035a', '\u0323'];
        const zalgoMid = ['\u0315', '\u0334', '\u0335', '\u0336', '\u0337', '\u0338', '\u0358', '\u0327', '\u0328', '\u035e', '\u035f', '\u0360', '\u0362', '\u0338', '\u035c', '\u0328'];

        function corruptText() {
            const sourceText = document.getElementById('normal-text').value;
            const outputBox = document.getElementById('output-box');

            if(!sourceText) {
                outputBox.innerText = "Awaiting data injection...";
                outputBox.style.color = "var(--text-muted)"; // reset to grey
                return;
            }

            let result = "";
            for (let i = 0; i < sourceText.length; i++) {
                let letter = sourceText[i];
                result += letter;
                if (letter !== " ") {
                    for (let j = 0; j < 2; j++) {
                        result += zalgoUp[Math.floor(Math.random() * zalgoUp.length)];
                        result += zalgoDown[Math.floor(Math.random() * zalgoDown.length)];
                        result += zalgoMid[Math.floor(Math.random() * zalgoMid.length)];
                    }
                }
            }
            outputBox.innerText = result;
            outputBox.style.color = "var(--status-danger)"; // Corrupted RED color
        }

        function copyToClipboard() {
            const textToCopy = document.getElementById('output-box').innerText;
            if(textToCopy === "Awaiting data injection...") return;

            navigator.clipboard.writeText(textToCopy).then(() => {
                const copyBtn = document.getElementById("copyBtn");
                copyBtn.innerHTML = '<i class="fas fa-check"></i> Extraction Complete';
                copyBtn.style.background = 'var(--status-success)';
                copyBtn.style.color = '#020617';
                
                setTimeout(() => {
                    copyBtn.innerHTML = '<i class="fas fa-copy"></i> Extract Code';
                    copyBtn.style.background = 'rgba(16, 185, 129, 0.1)';
                    copyBtn.style.color = 'var(--status-success)';
                }, 2000);
            }).catch(err => {
                alert("Extraction failed. Manual copy required.");
            });
        }

        function shareText() {
            const textToCopy = document.getElementById('output-box').innerText;
            if(textToCopy === "Awaiting data injection...") return;

            if (navigator.share) {
                navigator.share({
                    title: 'Phantomix Glitch Code',
                    text: textToCopy
                }).catch((error) => console.log('Error sharing', error));
            } else {
                alert("Direct broadcast not supported. Please copy the code manually.");
            }
        }
    </script>
</body>
</html>
