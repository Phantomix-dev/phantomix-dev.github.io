<!DOCTYPE html>
<html lang="en">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-LX3YH0GSZG"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-LX3YH0GSZG');
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick QR Terminal | Phantomix</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <meta name="description" content="Phantom-QR. Create custom QR codes for URLs, text, or WiFi instantly without server tracking.">
    <meta name="keywords" content="QR code generator, offline QR, secure QR maker, free QR tool">
    
    <meta property="og:title" content="Phantom-QR - Offline Generator | Phantomix">
    <meta property="og:description" content="Generate fast, secure, and track-free QR codes directly in your browser.">
    <meta property="og:url" content="https://phantomix-dev.github.io/qr.html">
    <meta property="og:image" content="https://raw.githubusercontent.com/phantomix-dev/phantomix-dev.github.io/main/qr-logo.png">
    <meta name="theme-color" content="#020617">

    <!-- Link to our global Design System -->
    <link rel="stylesheet" href="core.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Fira+Code:wght@500;700&display=swap" rel="stylesheet">

    <style>
        /* 🎨 CUSTOM PHANTOMIX TEXT SELECTION */
        ::selection { background-color: var(--brand-primary); color: #ffffff; }
        ::-moz-selection { background-color: var(--brand-primary); color: #ffffff; }

        /* ✨ PREMIUM FADE-IN ANIMATION */
        body {
            animation: appLoad 0.8s ease-out forwards;
            margin: 0; padding: 0; padding-top: 90px;
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-base); color: var(--text-primary);
            text-align: center; overflow-x: hidden; position: relative;
        }

        @keyframes appLoad {
            0% { opacity: 0; transform: translateY(15px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* Custom Cyber Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-base); }
        ::-webkit-scrollbar-thumb { background: rgba(14, 165, 233, 0.5); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--brand-primary); }

        /* GLOBAL NAVBAR */
        .phantomix-navbar {
            position: fixed; top: 0; left: 0; width: 100%; height: 70px;
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 5%; background: rgba(2, 6, 23, 0.8);
            backdrop-filter: blur(12px); border-bottom: 1px solid var(--surface-border);
            z-index: 1000; box-sizing: border-box;
        }
        .nav-logo { font-size: 20px; font-weight: 700; color: white; display: flex; align-items: center; text-decoration: none; gap: 8px; }
        .nav-btn {
            background: rgba(14, 165, 233, 0.1); color: var(--brand-primary); padding: 8px 18px;
            border: 1px solid var(--brand-primary); border-radius: var(--radius-sm); text-decoration: none;
            font-size: 14px; font-weight: 600; transition: all 0.3s ease;
        }
        .nav-btn:hover { background: var(--brand-primary); color: white; box-shadow: 0 0 15px rgba(14, 165, 233, 0.4); }

        /* Workspace Layout */
        .app-layout { max-width: 600px; margin: 0 auto; padding: 20px; }
        
        .qr-workspace {
            background: var(--surface-main); border: 1px solid var(--surface-border);
            border-radius: var(--radius-lg); padding: 35px; box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            text-align: center;
        }

        /* Input Styling */
        .input-group { position: relative; margin-bottom: 30px; }
        .input-group i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--brand-primary); font-size: 18px; }
        .cyber-input {
            width: 100%; padding: 18px 15px 18px 45px; background: rgba(2, 6, 23, 0.8);
            border: 1px solid var(--surface-border); color: var(--text-primary);
            border-radius: var(--radius-sm); font-family: 'Poppins', sans-serif;
            font-size: 15px; outline: none; transition: 0.3s; box-sizing: border-box;
        }
        .cyber-input:focus { border-color: var(--brand-primary); box-shadow: 0 0 20px rgba(14, 165, 233, 0.2); }
        .cyber-input::placeholder { color: var(--text-muted); opacity: 0.6; }

        /* QR Canvas Frame */
        .qr-frame {
            background: #ffffff; padding: 20px; border-radius: var(--radius-md);
            display: inline-block; box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            border: 2px solid var(--brand-primary); position: relative; margin-bottom: 25px;
            transition: all 0.4s ease; min-width: 200px; min-height: 200px;
        }
        /* Scanner Corner Accents */
        .qr-frame::before, .qr-frame::after { content: ''; position: absolute; width: 20px; height: 20px; border: 3px solid var(--brand-primary); }
        .qr-frame::before { top: -6px; left: -6px; border-right: none; border-bottom: none; border-radius: 4px 0 0 0; }
        .qr-frame::after { bottom: -6px; right: -6px; border-left: none; border-top: none; border-radius: 0 0 4px 0; }
        
        #qr-canvas { display: flex; justify-content: center; align-items: center; }
        #qr-canvas img { display: block; margin: 0 auto; border-radius: 4px; }
        
        .empty-state { color: #cbd5e1; font-size: 13px; font-weight: 600; font-family: 'Fira Code', monospace; display: flex; flex-direction: column; gap: 10px; align-items: center; justify-content: center; height: 160px; }

        /* Action Buttons */
        .action-row { display: flex; gap: 15px; justify-content: center; opacity: 0; pointer-events: none; transition: 0.3s; transform: translateY(10px); }
        .action-row.active { opacity: 1; pointer-events: auto; transform: translateY(0); }

        .btn-action {
            flex: 1; padding: 14px; border-radius: var(--radius-sm); font-size: 14px; font-weight: 700;
            cursor: pointer; transition: 0.3s; display: flex; justify-content: center; align-items: center; gap: 8px;
            font-family: 'Poppins', sans-serif;
        }
        .btn-download {
            background: linear-gradient(135deg, var(--brand-primary), #3b82f6); color: #fff; border: none;
        }
        .btn-download:hover { box-shadow: 0 0 25px rgba(14, 165, 233, 0.4); transform: translateY(-2px); }
        
        .btn-share {
            background: rgba(255,255,255,0.05); color: var(--text-primary); border: 1px solid var(--surface-border);
        }
        .btn-share:hover { background: rgba(255,255,255,0.1); border-color: var(--text-secondary); transform: translateY(-2px); }

        @media (max-width: 600px) {
            .phantomix-navbar { padding: 0 15px; height: 60px; }
            .nav-logo { font-size: 16px; }
            .nav-btn { padding: 6px 12px; font-size: 12px; }
            .action-row { flex-direction: column; }
        }
    </style>
</head>
<body>
    <div id="cyber-toast" style="display: none; position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #020617; border: 1px solid #10b981; color: #fff; padding: 12px 24px; border-radius: 30px; font-size: 13px; font-family: 'Fira Code', monospace; z-index: 10000; align-items: center; gap: 10px; box-shadow: 0 0 20px rgba(16, 185, 129, 0.4); text-align: center; white-space: nowrap;">
        <span style="width: 8px; height: 8px; background: #10b981; border-radius: 50%; display: inline-block; box-shadow: 0 0 8px #10b981;"></span> <span id="toast-message">Action Complete</span>
    </div>

    <!-- GLOBAL NAVBAR -->
    <nav class="phantomix-navbar">
        <a href="index.html" class="nav-logo">
            <i class="fa-solid fa-gem" style="color: var(--brand-primary);"></i> PHANTOMIX
        </a>
        <a href="apps.html" class="nav-btn"><i class="fas fa-arrow-left"></i> Back to Hub</a>
    </nav>

    <div class="app-layout">
        
        <div style="text-align: center; margin-bottom: 30px;">
            <h1 style="font-size: 32px; margin-bottom: 10px;">Phantom <span style="color: var(--brand-primary);">QR Studio</span></h1>
            <p style="color: var(--text-secondary); font-size: 14px; max-width: 500px; margin: 0 auto;">
                Real-time 100% offline vector matrix encoder. Paste secure URLs or text streams below.
            </p>
        </div>

        <section class="qr-workspace">
            
            <div class="input-group">
                <i class="fas fa-link"></i>
                <input type="text" id="qr-data" class="cyber-input" placeholder="Enter URL, text, or data payload..." oninput="generateQRMatrix()">
            </div>

            <div class="qr-frame">
                <div id="qr-canvas">
                    <div class="empty-state">
                        <i class="fas fa-qrcode" style="font-size: 40px; color: var(--surface-border);"></i>
                        Awaiting Payload...
                    </div>
                </div>
            </div>

            <div class="action-row" id="action-row">
                <button class="btn-action btn-download" onclick="downloadQR()">
                    <i class="fas fa-download"></i> Save Image
                </button>
                <button class="btn-action btn-share" onclick="shareQR()">
                    <i class="fas fa-share-nodes"></i> Share
                </button>
            </div>

        </section>
    </div>

    <!-- QR Code Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <script>
        let qrContainer = document.getElementById("qr-canvas");
        let actionRow = document.getElementById("action-row");
        let qrcodeInstance = null;

        function showCyberToast(message) {
            const toast = document.getElementById("cyber-toast");
            document.getElementById("toast-message").innerText = message;
            toast.style.display = "flex";
            setTimeout(() => { toast.style.display = "none"; }, 3000);
        }

        function generateQRMatrix() {
            const rawString = document.getElementById("qr-data").value;

            if(!rawString) {
                qrContainer.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-qrcode" style="font-size: 40px; color: var(--surface-border);"></i>
                        Awaiting Payload...
                    </div>`;
                actionRow.classList.remove("active");
                return;
            }

            qrContainer.innerHTML = ""; // Clear existing

            // Note: Dark blue on white scans much faster and accurately than light blue on dark slate.
            qrcodeInstance = new QRCode(qrContainer, {
                text: rawString,
                width: 200,
                height: 200,
                colorDark : "#020617",  // Deep Navy (Highly scannable)
                colorLight : "#ffffff", // Pure White
                correctLevel : QRCode.CorrectLevel.H 
            });

            actionRow.classList.add("active");
        }

        function downloadQR() {
            // Find the image generated by qrcode.js
            const qrImage = qrContainer.querySelector("img");
            if(qrImage && qrImage.src) {
                const link = document.createElement("a");
                link.href = qrImage.src;
                link.download = "Phantom_QR_" + Math.floor(Math.random() * 10000) + ".png";
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                showCyberToast("QR Code Downloaded!");
            } else {
                showCyberToast("Error: Canvas not ready.");
            }
        }

        function shareQR() {
            const rawString = document.getElementById("qr-data").value;
            if (navigator.share) {
                navigator.share({
                    title: 'Phantomix Secure QR',
                    text: 'Here is the data payload from my Phantomix QR: ' + rawString
                }).catch((error) => console.log('Error sharing', error));
            } else {
                showCyberToast("Direct sharing not supported on this browser.");
            }
        }
    </script>
</body>
</html>
