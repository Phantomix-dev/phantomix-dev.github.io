<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For You ❤️</title>
    <!-- Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Comic+Neue:wght@700&family=Poppins:wght@400;600&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            /* Animated Gradient Background */
            background: linear-gradient(-45deg, #ff9a9e, #fecfef, #fbc2eb, #a18cd1);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            padding: 20px;
            position: relative;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Floating Hearts */
        .heart {
            position: absolute;
            bottom: -100px;
            background-color: red;
            width: 20px;
            height: 20px;
            transform: rotate(-45deg);
            animation: float 5s infinite ease-in;
            opacity: 0.5;
        }
        .heart::before, .heart::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            background-color: red;
            border-radius: 50%;
        }
        .heart::before { top: -10px; left: 0; }
        .heart::after { top: 0; left: 10px; }

        @keyframes float {
            0% { transform: translateY(0) rotate(-45deg) scale(0.8); opacity: 0; }
            50% { opacity: 0.6; }
            100% { transform: translateY(-100vh) rotate(-45deg) scale(1.2); opacity: 0; }
        }

        /* Glassmorphism Container */
        .container {
            background: rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.3);
            text-align: center;
            max-width: 400px;
            width: 100%;
            position: relative;
            z-index: 10;
        }

        .step { display: none; animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .step.active { display: block; }

        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1); }
        }

        h1 {
            font-family: 'Comic Neue', cursive;
            color: #d63031;
            margin-bottom: 20px;
            font-size: 1.8rem;
            text-shadow: 1px 1px 2px rgba(255,255,255,0.8);
        }

        img.gif {
            width: 100%;
            max-width: 200px;
            border-radius: 15px;
            margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .btn-group { display: flex; justify-content: center; gap: 20px; margin-top: 20px; }

        button {
            padding: 12px 30px;
            font-size: 1.1rem;
            font-weight: 600;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-yes {
            background: linear-gradient(45deg, #00b09b, #96c93d);
            color: white;
            box-shadow: 0 4px 15px rgba(0, 176, 155, 0.4);
        }
        .btn-yes:hover { transform: scale(1.1); box-shadow: 0 6px 20px rgba(0, 176, 155, 0.6); }

        .btn-no {
            background: linear-gradient(45deg, #ff416c, #ff4b2b);
            color: white;
            box-shadow: 0 4px 15px rgba(255, 65, 108, 0.4);
            position: relative;
        }

        .btn-next { background: linear-gradient(45deg, #4776E6, #8E54E9); color: white; width: 100%; margin-top: 20px; }
        .btn-next:hover { transform: translateY(-2px); }

        input {
            width: 100%; padding: 12px; margin: 10px 0;
            border: none; border-radius: 10px;
            font-family: 'Poppins', sans-serif;
            background: rgba(255, 255, 255, 0.8);
            outline: none; box-shadow: inset 0 2px 5px rgba(0,0,0,0.05);
        }

        .food-options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .food-card {
            background: rgba(255, 255, 255, 0.6);
            border-radius: 10px; padding: 10px; cursor: pointer; transition: 0.3s; font-weight: 600;
        }
        .food-card:hover { transform: translateY(-3px); }
        .food-card.selected { background: #ff4757; color: white; box-shadow: 0 4px 10px rgba(255, 71, 87, 0.4); }

    </style>
</head>
<body>

    <!-- Background Audio (Add your own song URL or local file here) -->
    <!-- Browsers require user interaction to play audio, so it plays on clicking "Yes" -->
    <audio id="bgMusic" loop>
        <!-- Ye romantic lofi ka sample link hai, tum change kar sakte ho -->
        <source src="https://assets.mixkit.co/music/preview/mixkit-beautiful-dream-493.mp3" type="audio/mpeg">
    </audio>

    <div class="container">
        
        <!-- STEP 1 -->
        <div id="step1" class="step active">
            <img class="gif" src="https://media.tenor.com/ef30s-LzY78AAAAi/tkthao219-bubududu.gif" alt="Cute Bear">
            <h1>Will you be my girlfriend? 🥺❤️</h1>
            <div class="btn-group">
                <button class="btn-yes" onclick="yesClicked()">Yes!</button>
                <button class="btn-no" id="noBtn">No</button>
            </div>
        </div>

        <!-- STEP 2 -->
        <div id="step2" class="step">
            <img class="gif" src="https://media.tenor.com/Z7_D91tXlKAAAAAi/tkthao219-bubududu.gif" alt="Happy Bear">
            <h1>Yayyy! I love you! 🥰<br>Ab batao, Date pe kya khaogi?</h1>
            <div class="food-options">
                <div class="food-card" onclick="selectFood(this)">🍕 Pizza</div>
                <div class="food-card" onclick="selectFood(this)">🥟 Momos</div>
                <div class="food-card" onclick="selectFood(this)">🍔 Burger</div>
                <div class="food-card" onclick="selectFood(this)">☕ Cafe Vibes</div>
            </div>
            <button class="btn-next" onclick="nextStep(3)">Next ➡️</button>
        </div>

        <!-- STEP 3 -->
        <div id="step3" class="step">
            <img class="gif" src="https://media.tenor.com/qU3VwY535V8AAAAi/bubududu-bear.gif" alt="Walking Bear">
            <h1>Kaha chalna hai? 🚗</h1>
            <input type="text" id="location" placeholder="Tumhari favorite jagah...">
            <button class="btn-next" onclick="nextStep(4)">Next ➡️</button>
        </div>

        <!-- STEP 4 -->
        <div id="step4" class="step">
            <img class="gif" src="https://media.tenor.com/P0C6G5eT9f4AAAAi/bubu-dudu-date.gif" alt="Waiting Bear">
            <h1>Kab free ho? 🕒</h1>
            <input type="date" id="date">
            <input type="time" id="time">
            <!-- Add a loader to button to show processing -->
            <button class="btn-next" id="submitBtn" onclick="finish()">Fix the Date! ❤️</button>
        </div>

        <!-- STEP 5 -->
        <div id="step5" class="step">
            <img class="gif" src="https://media.tenor.com/8Nn3lJ25-YMAAAAi/bubu-bubu-dudu.gif" alt="Kiss Bear">
            <h1>It's a Date! 🎉</h1>
            <p style="margin-top: 10px; color: #333; font-weight: 600;">Maine Details save kar li hai! Mai tumhe pick kar lunga. 🚗💨</p>
            <p id="finalDetails" style="margin-top: 15px; font-size: 0.9rem; color: #d63031; font-weight: bold;"></p>
        </div>

    </div>

    <script>
        // --- 1. FLOATING HEARTS ANIMATION ---
        function createHeart() {
            const heart = document.createElement("div");
            heart.classList.add("heart");
            heart.style.left = Math.random() * 100 + "vw";
            heart.style.animationDuration = Math.random() * 2 + 3 + "s";
            document.body.appendChild(heart);
            setTimeout(() => { heart.remove(); }, 5000);
        }
        setInterval(createHeart, 300);

        // --- 2. RUNAWAY NO BUTTON LOGIC ---
        const noBtn = document.getElementById('noBtn');
        function moveButton() {
            const x = Math.random() * (window.innerWidth - noBtn.offsetWidth - 20);
            const y = Math.random() * (window.innerHeight - noBtn.offsetHeight - 20);
            noBtn.style.position = 'fixed';
            noBtn.style.left = `${Math.max(10, x)}px`;
            noBtn.style.top = `${Math.max(10, y)}px`;
            noBtn.style.zIndex = "1000";
        }
        noBtn.addEventListener('mouseover', moveButton);
        noBtn.addEventListener('touchstart', (e) => { e.preventDefault(); moveButton(); });

        // --- 3. CONFETTI & MUSIC LOGIC ---
        function yesClicked() {
            // Play Music
            document.getElementById('bgMusic').play();
            // Confetti Burst
            confetti({ particleCount: 150, spread: 80, origin: { y: 0.6 } });
            nextStep(2);
        }

        // --- 4. STEP NAVIGATION ---
        function nextStep(stepNumber) {
            document.querySelectorAll('.step').forEach(step => step.classList.remove('active'));
            document.getElementById('step' + stepNumber).classList.add('active');
        }

        // --- 5. FOOD SELECTION ---
        let selectedFood = "Surprise me!";
        function selectFood(element) {
            document.querySelectorAll('.food-card').forEach(card => card.classList.remove('selected'));
            element.classList.add('selected');
            selectedFood = element.innerText;
        }

        // --- 6. BACKEND SUBMISSION ---
        async function finish() {
            const location = document.getElementById('location').value || 'Surprise me!';
            const date = document.getElementById('date').value;
            const time = document.getElementById('time').value;

            if(!date || !time) {
                alert("Please ek Date aur Time bata do! 🥺");
                return;
            }

            const btn = document.getElementById('submitBtn');
            btn.innerText = "Sending to my heart... 💓";
            btn.disabled = true;

            // Form Data Payload
            const payload = {
                Subject: "She said YES! 🎉 Here are the Date details",
                Food: selectedFood,
                Location: location,
                Date: date,
                Time: time
            };

            // !!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!
            // DEVELOPER! PASTE YOUR FORMSPREE URL BELOW
            // !!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!
            const formspreeEndpoint = "https://formspree.io/f/mdeobrnn"; 

            try {
                // Sending data via API
                if(formspreeEndpoint.includes("YOUR_FORM_ID_HERE")) {
                    console.log("Backend not connected. Details:", payload);
                } else {
                    await fetch(formspreeEndpoint, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                }
            } catch (error) {
                console.error(error);
            }

            // Move to Final Step & Trigger Final Confetti
            nextStep(5);
            confetti({ particleCount: 300, spread: 100, origin: { y: 0.5 } });

            document.getElementById('finalDetails').innerHTML = `
                🍽️ Khana: ${selectedFood} <br>
                📍 Jagah: ${location} <br>
                📅 Date: ${date} <br>
                ⏰ Time: ${time}
            `;
        }
    </script>
</body>
</html>
