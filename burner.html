<!DOCTYPE html>
<html lang="en">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-LX3YH0GSZG"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-LX3YH0GSZG');
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Burner Protocol | Phantomix</title>
    
    <!-- Link to our global Design System -->
    <link rel="stylesheet" href="core.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Fira+Code:wght@500;700&display=swap" rel="stylesheet">

    <style>
        .burner-box {
            background: var(--surface-main); border: 1px solid var(--status-danger);
            border-radius: var(--radius-lg); padding: 30px; text-align: left;
            position: relative; overflow: hidden; box-shadow: 0 10px 40px rgba(239, 68, 68, 0.15);
        }
        /* Top Glowing Bar */
        .burner-box::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 4px;
            background: linear-gradient(90deg, var(--status-danger), var(--status-warning), var(--status-danger));
            background-size: 200% auto; animation: shine 3s linear infinite;
        }
        @keyframes shine { to { background-position: 200% center; } }

        .stealth-textarea {
            width: 100%; height: 200px; background: rgba(2, 6, 23, 0.8); border: 1px dashed var(--surface-border);
            color: var(--status-success); font-family: 'Fira Code', monospace; font-size: 15px;
            padding: 20px; border-radius: var(--radius-md); outline: none; resize: none; transition: 0.3s;
            box-sizing: border-box; margin-bottom: 20px;
        }
        .stealth-textarea:focus { border-color: var(--status-danger); box-shadow: 0 0 15px rgba(239, 68, 68, 0.2); }
        .stealth-textarea::placeholder { color: var(--text-muted); opacity: 0.5; }

        .btn-burn {
            width: 100%; padding: 15px; background: linear-gradient(135deg, var(--status-danger), #b91c1c);
            color: white; border: none; border-radius: var(--radius-md); font-size: 16px; font-weight: 700;
            cursor: pointer; transition: 0.3s; display: flex; justify-content: center; align-items: center; gap: 10px;
        }
        .btn-burn:hover { box-shadow: 0 0 25px rgba(239, 68, 68, 0.4); transform: translateY(-2px); }

        #link-box {
            margin-top: 25px; background: #020617; padding: 20px; border-radius: var(--radius-sm);
            border: 1px solid var(--surface-border); display: none; animation: fadeIn 0.4s;
        }
        
        .link-input {
            width: 100%; padding: 12px; background: rgba(16, 185, 129, 0.1); border: 1px solid var(--status-success);
            color: var(--status-success); border-radius: var(--radius-sm); font-family: 'Fira Code', monospace;
            font-size: 13px; text-align: center; outline: none; box-sizing: border-box; margin-bottom: 15px;
        }

        .action-row { display: flex; gap: 10px; }
        .btn-secondary {
            flex: 1; padding: 12px; background: var(--surface-elevated); color: var(--text-primary);
            border: 1px solid var(--surface-border); border-radius: var(--radius-sm); font-weight: 600;
            cursor: pointer; transition: 0.3s;
        }
        .btn-secondary:hover { background: rgba(14, 165, 233, 0.1); border-color: var(--brand-primary); color: var(--brand-primary); }

        .warning-text { color: var(--status-danger); font-size: 13px; font-weight: 700; margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }
        
        .hidden { display: none !important; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <!-- GLOBAL NAVBAR -->
    <nav style="display: flex; justify-content: space-between; align-items: center; padding: 15px 5%; border-bottom: 1px solid var(--surface-border); background: var(--surface-main); backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 100;">
        <a href="index.html" style="font-weight: bold; font-size: 18px; color: var(--text-primary); text-decoration: none; display: flex; align-items: center; gap: 8px;">
            <i class="fa-solid fa-gem" style="color: var(--brand-primary);"></i> PHANTOMIX
        </a>
        <a href="apps.html" style="color: var(--text-secondary); text-decoration: none; font-size: 14px; font-weight: 600; padding: 8px 16px; background: rgba(14, 165, 233, 0.1); border: 1px solid var(--brand-primary); border-radius: var(--radius-sm); color: var(--brand-primary);"><i class="fas fa-arrow-left"></i> Hub</a>
    </nav>

    <div class="app-layout" style="max-width: 700px; grid-template-columns: 1fr;">
        
        <div style="text-align: center; margin-bottom: 20px;">
            <h1 style="font-size: 32px; margin-bottom: 10px;">The <span style="color: var(--status-danger);">Burner Protocol</span></h1>
            <p style="color: var(--text-secondary); font-size: 14px;">Secure transmissions that self-destruct immediately after reading. Zero logs.</p>
        </div>

        <!-- CREATE NOTE SECTION -->
        <section class="burner-box" id="create-section">
            <h3 style="margin: 0 0 15px 0; font-size: 16px; color: var(--text-primary);"><i class="fas fa-pen-nib"></i> Compose Secret</h3>
            <textarea id="secret-message" class="stealth-textarea" placeholder="Type your highly sensitive message here..."></textarea>
            
            <button class="btn-burn" id="generate-btn" onclick="createNote()">
                <i class="fas fa-fire"></i> Generate Burner Link
            </button>

            <!-- Link Generated Output -->
            <div id="link-box">
                <p style="margin: 0 0 10px 0; font-size: 12px; color: var(--text-muted); text-transform: uppercase; font-weight: bold;">Transmission Ready</p>
                <input type="text" id="generatedLink" class="link-input" readonly>
                <div class="action-row">
                    <button class="btn-secondary" id="copyBtn" onclick="copyLink()"><i class="fas fa-copy"></i> Copy Link</button>
                    <button class="btn-secondary" onclick="shareLink()"><i class="fas fa-share-nodes"></i> Share</button>
                </div>
            </div>
        </section>

        <!-- READ NOTE SECTION (Hidden by default) -->
        <section class="burner-box hidden" id="read-section">
            <div class="warning-text">
                <i class="fas fa-triangle-exclamation"></i> WARNING: This message has been permanently deleted from our servers. Once you close this page, it is gone forever.
            </div>
            <textarea id="decrypted-message" class="stealth-textarea" style="color: var(--brand-primary); border-color: var(--brand-primary);" readonly></textarea>
            
            <button class="btn-secondary" style="width: 100%; margin-top: 15px;" onclick="window.location.href='burner.html'">
                <i class="fas fa-plus"></i> Create New Burner
            </button>
        </section>

    </div>

    <!-- SUPABASE ORIGINAL LOGIC -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const url = "https://pekmsttmosuzcvielala.supabase.co";
        const key = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBla21zdHRtb3N1emN2aWVsYWxhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM0MjY4NDUsImV4cCI6MjA5OTAwMjg0NX0.D0akjMO2d5sYhgbSy8IIFJT4sPHGO_Lm9r1YMWM_uUc";
        const clientSupabase = supabase.createClient(url, key);

        async function createNote() {
            const message = document.getElementById('secret-message').value;
            const btn = document.getElementById('generate-btn');

            if (!message) {
                alert("Please type a message first!");
                return;
            }

            btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Encrypting...';
            btn.style.opacity = '0.7';

            const { data, error } = await clientSupabase
                .from('burner_notes')
                .insert([{ message: message }])
                .select();

            btn.innerHTML = '<i class="fas fa-fire"></i> Generate Burner Link';
            btn.style.opacity = '1';

            if (error) {
                alert("Transmission failed. Database Error.");
            } else if (data && data.length > 0) {
                const noteId = data[0].id;
                const link = window.location.origin + window.location.pathname + "?note=" + noteId;

                document.getElementById('generatedLink').value = link;
                document.getElementById('link-box').style.display = 'block';
                document.getElementById('secret-message').value = ""; // Clear text for safety
            }
        }

        async function checkUrlForNote() {
            const urlParams = new URLSearchParams(window.location.search);
            const noteId = urlParams.get('note');

            if (noteId) {
                document.getElementById('create-section').classList.add('hidden');
                document.getElementById('read-section').classList.remove('hidden');
                
                const decMessage = document.getElementById('decrypted-message');
                decMessage.value = "Decrypting transmission...";

                const { data, error } = await clientSupabase
                    .from('burner_notes')
                    .select('message')
                    .eq('id', noteId)
                    .single();

                if (data) {
                    decMessage.value = data.message;
                    // Burn it!
                    await clientSupabase.from('burner_notes').delete().eq('id', noteId);
                } else {
                    decMessage.value = "[ERROR] Transmission not found. The message has already self-destructed or the link is invalid. 💥";
                    decMessage.style.color = "var(--status-danger)";
                    decMessage.style.borderColor = "var(--status-danger)";
                }
            }
        }

        function copyLink() {
            const linkInput = document.getElementById("generatedLink");
            navigator.clipboard.writeText(linkInput.value).then(() => {
                const copyBtn = document.getElementById("copyBtn");
                copyBtn.innerHTML = '<i class="fas fa-check"></i> Copied!';
                copyBtn.style.background = 'rgba(16, 185, 129, 0.1)';
                copyBtn.style.color = 'var(--status-success)';
                copyBtn.style.borderColor = 'var(--status-success)';
                
                setTimeout(() => {
                    copyBtn.innerHTML = '<i class="fas fa-copy"></i> Copy Link';
                    copyBtn.style = ''; // reset styles
                }, 2000);
            });
        }

        function shareLink() {
            const linkInput = document.getElementById("generatedLink").value;
            if (navigator.share) {
                navigator.share({
                    title: 'Secret Burner Note',
                    text: 'I sent you a self-destructing secret message. Open it carefully:',
                    url: linkInput
                }).catch((error) => console.log('Error sharing', error));
            } else {
                alert("Your browser does not support native sharing.");
            }
        }

        window.onload = checkUrlForNote;
    </script>

</body>
</html>
