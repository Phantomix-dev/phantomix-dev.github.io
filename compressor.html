<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phantom-Shrink | Offline Image Compressor</title>
    
    <link rel="stylesheet" href="core.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        .upload-zone {
            background: var(--bg-base); border: 2px dashed var(--surface-border);
            border-radius: var(--radius-lg); padding: 50px 20px; text-align: center;
            cursor: pointer; transition: all 0.3s ease; position: relative;
        }
        .upload-zone:hover { border-color: var(--brand-primary); background: rgba(14, 165, 233, 0.05); }
        .upload-zone i { font-size: 48px; color: var(--brand-primary); margin-bottom: 15px; }
        .upload-zone h4 { color: var(--text-primary); margin: 0 0 5px 0; font-size: 18px; }
        .upload-zone p { color: var(--text-muted); font-size: 13px; margin: 0; }
        
        #fileInput { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }

        .workspace { display: none; margin-top: 30px; }
        
        .preview-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; }
        .preview-box { background: var(--bg-base); border: 1px solid var(--surface-border); border-radius: var(--radius-md); padding: 15px; text-align: center; }
        .preview-img { max-width: 100%; max-height: 250px; border-radius: var(--radius-sm); margin-bottom: 15px; object-fit: contain; background: #020617; }
        
        .stat-label { color: var(--text-muted); font-size: 12px; text-transform: uppercase; font-weight: 600; }
        .stat-value { font-size: 20px; font-weight: 700; color: var(--text-primary); margin: 5px 0 0 0; }
        .stat-success { color: var(--status-success); }

        .controls { background: var(--bg-base); padding: 20px; border-radius: var(--radius-md); border: 1px solid var(--surface-border); margin-bottom: 25px; }
        .slider-header { display: flex; justify-content: space-between; margin-bottom: 15px; color: var(--text-primary); font-weight: 600; }
        .quality-badge { background: rgba(14, 165, 233, 0.1); color: var(--brand-primary); padding: 4px 12px; border-radius: 20px; font-size: 14px; }
        
        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; height: 20px; width: 20px; border-radius: 50%;
            background: var(--brand-primary); cursor: pointer; margin-top: -8px; box-shadow: 0 0 10px var(--brand-primary);
        }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 6px; cursor: pointer; background: var(--surface-border); border-radius: 5px; }

        @media (max-width: 768px) {
            .preview-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <!-- GLOBAL NAVBAR -->
    <nav style="display: flex; justify-content: space-between; align-items: center; padding: 15px 5%; border-bottom: 1px solid var(--surface-border); background: var(--surface-main); backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 100;">
        <a href="index.html" style="font-weight: bold; font-size: 18px; color: var(--text-primary); text-decoration: none; display: flex; align-items: center; gap: 8px;">
            <i class="fa-solid fa-gem" style="color: var(--brand-primary);"></i> PHANTOMIX
        </a>
        <a href="apps.html" style="color: var(--text-secondary); text-decoration: none; font-size: 14px; font-weight: 600; padding: 8px 16px; background: rgba(14, 165, 233, 0.1); border: 1px solid var(--brand-primary); border-radius: var(--radius-sm); color: var(--brand-primary);"><i class="fas fa-arrow-left"></i> Hub</a>
    </nav>

    <div class="app-layout" style="max-width: 900px; grid-template-columns: 1fr;">
        
        <div style="text-align: center; margin-bottom: 10px;">
            <h1 style="font-size: 28px; margin-bottom: 10px;">Phantom <span style="color: var(--brand-primary);">Shrink</span></h1>
            <p style="color: var(--text-secondary); font-size: 14px;">Lossless image compression entirely in your browser. Zero server uploads.</p>
            <div style="display: flex; gap: 10px; justify-content: center; margin-top: 15px;">
                <span style="font-size: 10px; font-weight: bold; padding: 4px 10px; border-radius: 4px; background: rgba(139, 92, 246, 0.1); color: var(--brand-secondary); border: 1px solid rgba(139, 92, 246, 0.3);"><i class="fas fa-microchip"></i> 100% LOCAL</span>
            </div>
        </div>

        <section style="background: var(--surface-main); border: 1px solid var(--surface-border); border-radius: var(--radius-lg); padding: var(--space-xl);">
            
            <div class="upload-zone" id="dropZone">
                <i class="fas fa-compress-arrows-alt"></i>
                <h4>Select an Image</h4>
                <p>Drop your heavy JPG or PNG here.</p>
                <input type="file" id="fileInput" accept="image/jpeg, image/png, image/webp">
            </div>

            <!-- Workspace: Visible after upload -->
            <div class="workspace" id="workspace">
                
                <div class="controls">
                    <div class="slider-header">
                        <span>Compression Quality</span>
                        <span class="quality-badge" id="quality-val">80%</span>
                    </div>
                    <input type="range" id="qualitySlider" min="10" max="100" value="80">
                </div>

                <div class="preview-grid">
                    <div class="preview-box">
                        <div class="stat-label">Original File</div>
                        <img id="origImg" class="preview-img" src="" alt="Original">
                        <p class="stat-value" id="origSize">0 MB</p>
                    </div>
                    <div class="preview-box" style="border-color: var(--status-success);">
                        <div class="stat-label" style="color: var(--status-success);">Compressed File</div>
                        <img id="compImg" class="preview-img" src="" alt="Compressed">
                        <p class="stat-value stat-success" id="compSize">0 MB</p>
                        <p style="margin: 5px 0 0 0; font-size: 12px; color: var(--status-success); font-weight: bold;" id="savedSpace">Saved: 0%</p>
                    </div>
                </div>

                <div style="display: flex; gap: 15px;">
                    <a id="downloadBtn" href="#" class="btn-primary" style="flex: 2; text-align: center; text-decoration: none; padding: 15px; font-size: 16px;">
                        <i class="fas fa-download"></i> Download Compressed
                    </a>
                    <button onclick="resetTool()" style="flex: 1; background: var(--bg-base); color: var(--text-primary); border: 1px solid var(--surface-border); border-radius: var(--radius-md); font-weight: 600; cursor: pointer; transition: 0.3s;">
                        <i class="fas fa-redo"></i> New
                    </button>
                </div>

            </div>

        </section>
    </div>

    <!-- Compression Logic -->
    <script>
        const fileInput = document.getElementById('fileInput');
        const dropZone = document.getElementById('dropZone');
        const workspace = document.getElementById('workspace');
        
        const origImg = document.getElementById('origImg');
        const compImg = document.getElementById('compImg');
        const origSizeTxt = document.getElementById('origSize');
        const compSizeTxt = document.getElementById('compSize');
        const savedSpaceTxt = document.getElementById('savedSpace');
        const downloadBtn = document.getElementById('downloadBtn');
        
        const qualitySlider = document.getElementById('qualitySlider');
        const qualityVal = document.getElementById('quality-val');

        let originalFile = null;
        let originalFileName = "";

        // Format Bytes to KB/MB
        function formatBytes(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        // Handle File Selection
        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            originalFile = file;
            originalFileName = file.name;
            
            // Show Workspace
            dropZone.style.display = 'none';
            workspace.style.display = 'block';

            // Set Original Data
            origSizeTxt.innerText = formatBytes(file.size);
            const origUrl = URL.createObjectURL(file);
            origImg.src = origUrl;

            // Run initial compression
            compressImage();
        });

        // Handle Slider Change
        qualitySlider.addEventListener('input', function() {
            qualityVal.innerText = this.value + "%";
            compressImage();
        });

        // 🧠 The Tech Hack: HTML5 Canvas Blob Compression
        function compressImage() {
            if (!originalFile) return;

            const quality = qualitySlider.value / 100;
            const reader = new FileReader();

            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    canvas.width = img.width;
                    canvas.height = img.height;
                    
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0);

                    // Force compression as JPEG (allows quality reduction)
                    canvas.toBlob((blob) => {
                        const compUrl = URL.createObjectURL(blob);
                        compImg.src = compUrl;
                        
                        // Update Stats
                        compSizeTxt.innerText = formatBytes(blob.size);
                        
                        let savedPercent = ((originalFile.size - blob.size) / originalFile.size) * 100;
                        if (savedPercent < 0) savedPercent = 0; // Prevent negative values if compression makes it bigger
                        
                        savedSpaceTxt.innerText = `Space Saved: ${savedPercent.toFixed(1)}%`;

                        // Setup Download
                        downloadBtn.href = compUrl;
                        downloadBtn.download = `Phantom_Shrink_${originalFileName.split('.')[0]}.jpg`;
                        
                    }, 'image/jpeg', quality);
                }
                img.src = event.target.result;
            }
            reader.readAsDataURL(originalFile);
        }

        function resetTool() {
            fileInput.value = '';
            workspace.style.display = 'none';
            dropZone.style.display = 'block';
            originalFile = null;
        }
    </script>
</body>
</html>
