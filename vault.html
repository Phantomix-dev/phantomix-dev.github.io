<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diamond-Vault | Secure Password Generator</title>
    
    <link rel="stylesheet" href="core.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Fira+Code:wght@500;700&display=swap" rel="stylesheet">

    <style>
        .vault-display {
            background: #020617; border: 1px solid var(--brand-secondary);
            border-radius: var(--radius-md); padding: 25px 20px; text-align: center;
            position: relative; margin-bottom: 30px; box-shadow: 0 0 20px rgba(139, 92, 246, 0.15);
        }
        #password-output {
            font-family: 'Fira Code', monospace; font-size: 24px; color: #fff;
            word-break: break-all; letter-spacing: 2px; margin: 0; min-height: 35px;
        }
        .copy-icon {
            position: absolute; top: 15px; right: 15px; color: var(--brand-secondary);
            font-size: 18px; cursor: pointer; transition: 0.3s;
            background: rgba(139, 92, 246, 0.1); padding: 8px; border-radius: 6px;
        }
        .copy-icon:hover { background: var(--brand-secondary); color: #fff; transform: scale(1.1); }

        /* Range Slider Styling */
        .slider-container { margin-bottom: 25px; }
        .slider-header { display: flex; justify-content: space-between; margin-bottom: 15px; color: var(--text-primary); font-weight: 600; }
        .length-badge { background: rgba(14, 165, 233, 0.1); color: var(--brand-primary); padding: 4px 12px; border-radius: 20px; font-size: 14px; }
        
        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; height: 20px; width: 20px; border-radius: 50%;
            background: var(--brand-primary); cursor: pointer; margin-top: -8px; box-shadow: 0 0 10px var(--brand-primary);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%; height: 6px; cursor: pointer; background: var(--surface-border); border-radius: 5px;
        }

        /* Checkbox Options */
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 30px; }
        .option-lbl {
            display: flex; align-items: center; justify-content: space-between;
            background: var(--bg-base); border: 1px solid var(--surface-border);
            padding: 15px; border-radius: var(--radius-sm); cursor: pointer; transition: 0.3s;
        }
        .option-lbl:hover { border-color: var(--brand-secondary); }
        .option-lbl input { width: 18px; height: 18px; accent-color: var(--brand-secondary); cursor: pointer; }

        /* Strength Meter */
        .strength-meter { margin-top: -10px; margin-bottom: 25px; text-align: left; }
        .strength-bar { height: 6px; width: 100%; background: var(--surface-border); border-radius: 5px; overflow: hidden; margin-top: 8px; }
        .strength-fill { height: 100%; width: 0%; transition: all 0.4s ease; border-radius: 5px; }
        #strength-text { font-size: 12px; font-weight: 700; text-transform: uppercase; float: right; }
    </style>
</head>
<body>

    <!-- GLOBAL NAVBAR -->
    <nav style="display: flex; justify-content: space-between; align-items: center; padding: 15px 5%; border-bottom: 1px solid var(--surface-border); background: var(--surface-main); backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 100;">
        <a href="index.html" style="font-weight: bold; font-size: 18px; color: var(--text-primary); text-decoration: none; display: flex; align-items: center; gap: 8px;">
            <i class="fa-solid fa-gem" style="color: var(--brand-primary);"></i> PHANTOMIX
        </a>
        <a href="apps.html" style="color: var(--text-secondary); text-decoration: none; font-size: 14px; font-weight: 600; padding: 8px 16px; background: rgba(14, 165, 233, 0.1); border: 1px solid var(--brand-primary); border-radius: var(--radius-sm); color: var(--brand-primary);"><i class="fas fa-arrow-left"></i> Hub</a>
    </nav>

    <div class="app-layout" style="max-width: 600px; grid-template-columns: 1fr;">
        
        <div style="text-align: center; margin-bottom: 10px;">
            <h1 style="font-size: 28px; margin-bottom: 10px;">Diamond <span style="color: var(--brand-secondary);">Vault</span></h1>
            <p style="color: var(--text-secondary); font-size: 14px;">Quantum-grade offline password generation. Your keys never touch the internet.</p>
        </div>

        <section style="background: var(--surface-main); border: 1px solid var(--surface-border); border-radius: var(--radius-lg); padding: var(--space-xl);">
            
            <!-- Output Display -->
            <div class="vault-display">
                <i class="fas fa-copy copy-icon" id="copyBtn" onclick="copyPassword()" title="Copy to Clipboard"></i>
                <p id="password-output">Click Generate</p>
            </div>

            <!-- Strength Meter -->
            <div class="strength-meter">
                <span style="font-size: 13px; color: var(--text-secondary);">Security Level:</span>
                <span id="strength-text" style="color: var(--status-danger);">WEAK</span>
                <div class="strength-bar">
                    <div class="strength-fill" id="strength-fill" style="background: var(--status-danger); width: 25%;"></div>
                </div>
            </div>

            <!-- Length Slider -->
            <div class="slider-container">
                <div class="slider-header">
                    <span>Password Length</span>
                    <span class="length-badge" id="length-val">16</span>
                </div>
                <input type="range" id="slider" min="8" max="64" value="16" oninput="updateLength()">
            </div>

            <!-- Options Grid -->
            <div class="options-grid">
                <label class="option-lbl">
                    Uppercase (A-Z) <input type="checkbox" id="chk-upper" checked>
                </label>
                <label class="option-lbl">
                    Lowercase (a-z) <input type="checkbox" id="chk-lower" checked>
                </label>
                <label class="option-lbl">
                    Numbers (0-9) <input type="checkbox" id="chk-num" checked>
                </label>
                <label class="option-lbl">
                    Symbols (!@#$) <input type="checkbox" id="chk-sym" checked>
                </label>
            </div>

            <!-- Generate Button -->
            <button class="btn-primary" style="width: 100%; background: linear-gradient(135deg, var(--brand-secondary), #c084fc); border: none;" onclick="generatePassword()">
                <i class="fas fa-bolt"></i> Generate Secure Password
            </button>

        </section>
    </div>

    <script>
        const slider = document.getElementById('slider');
        const lengthVal = document.getElementById('length-val');
        const passOutput = document.getElementById('password-output');
        const copyBtn = document.getElementById('copyBtn');
        const strengthFill = document.getElementById('strength-fill');
        const strengthText = document.getElementById('strength-text');

        // Character Sets
        const chars = {
            upper: "ABCDEFGHIJKLMNOPQRSTUVWXYZ",
            lower: "abcdefghijklmnopqrstuvwxyz",
            num: "0123456789",
            sym: "!@#$%^&*()_+~`|}{[]:;?><,./-="
        };

        function updateLength() {
            lengthVal.innerText = slider.value;
            generatePassword(); // Auto-generate when sliding
        }

        function generatePassword() {
            let length = slider.value;
            let charset = "";
            let generatedPassword = "";

            if (document.getElementById('chk-upper').checked) charset += chars.upper;
            if (document.getElementById('chk-lower').checked) charset += chars.lower;
            if (document.getElementById('chk-num').checked) charset += chars.num;
            if (document.getElementById('chk-sym').checked) charset += chars.sym;

            if (charset === "") {
                passOutput.innerText = "Select at least 1 option!";
                passOutput.style.color = "var(--status-danger)";
                updateStrength(0);
                return;
            }

            passOutput.style.color = "#fff";

            // Secure Random Generation using Crypto API
            const randomValues = new Uint32Array(length);
            window.crypto.getRandomValues(randomValues);

            for (let i = 0; i < length; i++) {
                generatedPassword += charset[randomValues[i] % charset.length];
            }

            passOutput.innerText = generatedPassword;
            updateStrength(length, charset.length);
            
            // Reset Copy Icon
            copyBtn.className = "fas fa-copy copy-icon";
            copyBtn.style.background = "rgba(139, 92, 246, 0.1)";
        }

        // Calculate Password Entropy/Strength
        function updateStrength(length, poolSize) {
            if (poolSize === 0) {
                strengthFill.style.width = "0%";
                strengthText.innerText = "NONE";
                return;
            }

            // Entropy formula: Length * log2(Pool Size)
            const entropy = length * (Math.log(poolSize) / Math.log(2));

            if (entropy < 40) {
                strengthFill.style.width = "25%";
                strengthFill.style.background = "var(--status-danger)";
                strengthText.innerText = "WEAK";
                strengthText.style.color = "var(--status-danger)";
            } else if (entropy < 60) {
                strengthFill.style.width = "50%";
                strengthFill.style.background = "var(--status-warning)";
                strengthText.innerText = "GOOD";
                strengthText.style.color = "var(--status-warning)";
            } else if (entropy < 80) {
                strengthFill.style.width = "75%";
                strengthFill.style.background = "var(--status-success)";
                strengthText.innerText = "STRONG";
                strengthText.style.color = "var(--status-success)";
            } else {
                strengthFill.style.width = "100%";
                strengthFill.style.background = "#8b5cf6"; // Purple for Unbreakable
                strengthText.innerText = "UNBREAKABLE 🛡️";
                strengthText.style.color = "#8b5cf6";
            }
        }

        function copyPassword() {
            const pw = passOutput.innerText;
            if(pw === "Click Generate" || pw === "Select at least 1 option!") return;

            navigator.clipboard.writeText(pw).then(() => {
                copyBtn.className = "fas fa-check copy-icon";
                copyBtn.style.background = "var(--status-success)";
                copyBtn.style.color = "#fff";
            });
        }

        // Generate one on page load
        window.onload = generatePassword;
    </script>
</body>
</html>
